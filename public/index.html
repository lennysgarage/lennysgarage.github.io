    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      SPA deep-link restore for GitHub Pages.

      GitHub Pages serves 404.html (with HTTP 404) for unknown paths like
      /blog/.... That file redirects the browser to "/?p=<original-path>" with
      '&' encoded as '~and~'. This script runs synchronously in the head,
      *before* the deferred app bundle, so that by the time React Router boots
      the browser URL is already the intended deep-link path. This lets the SPA
      render the correct route (with the index.html document served at 200).
    -->
    <script type="text/javascript">
      (function (l) {
        if (!l.search) return;
        var q = {};
        l.search.slice(1).split('&').forEach(function (v) {
          if (!v) return;
          var a = v.split('=');
          q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
        });
        if (q.p !== undefined) {
          var path = q.p || '/';
          if (path.charAt(0) !== '/') path = '/' + path;
          window.history.replaceState(null, '', path);
        }
      }(window.location));
    </script>
    <title>Jonathan's Portfolio</title>
  </head>
